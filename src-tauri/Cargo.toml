[package]
name = "hots-draft"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Enemy hero pools while the draft opens"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hots-core = { path = "../crates/hots-core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
