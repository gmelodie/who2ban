[workspace]
resolver = "3"
members = ["crates/hots-parse", "crates/hots-core", "crates/hots-cli", "crates/hots-web"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
hots-parse = { path = "crates/hots-parse" }
hots-core = { path = "crates/hots-core" }
heroprotocol = { git = "https://github.com/gmelodie/rs-heroprotocol", rev = "89c39be" }

anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
dirs = "6"
notify = "8"
reqwest = { version = "0.13", default-features = false, features = [
    "charset",
    "http2",
    "json",
    "query",
    "rustls",
    "rustls-native-certs",
    "system-proxy",
] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
