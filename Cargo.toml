[workspace]
resolver = "3"
members = [
    "crates/w2b-parse",
    "crates/w2b-core",
    "crates/w2b-cli",
    "crates/w2b-web",
    "crates/w2b-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
w2b-parse = { path = "crates/w2b-parse" }
w2b-core = { path = "crates/w2b-core" }
heroprotocol = { git = "https://github.com/gmelodie/rs-heroprotocol", rev = "fda2dab" }

anyhow = "1"
axum = "0.8"
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui = "0.36"
clap = { version = "4", features = ["derive"] }
dirs = "6"
notify = "8"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "1"
ureq = { version = "3.4.0", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
